name: GitHub Release CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:

  # ==========================================================
  # PR ABIERTO
  # Calcula cuál sería la próxima versión.
  # No crea tag.
  # No crea Release.
  # ==========================================================
  check-version:

    if: github.event.action != 'closed'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Calcular versión semántica
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"

          # Ejemplo:
          # major: cambio grande
          major_pattern: "major:"

          # Ejemplo:
          # feat: nuevo módulo
          minor_pattern: "feat:"

          version_format: "${major}.${minor}.${patch}"

      - name: Mostrar próxima versión
        run: |
          echo "=========================================="
          echo " Próxima versión"
          echo "=========================================="
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag:     ${{ steps.version.outputs.version_tag }}"
          echo "Tipo:    ${{ steps.version.outputs.version_type }}"
          echo "=========================================="


  # ==========================================================
  # PR MERGEADO A MAIN
  # Crea automáticamente:
  #
  #   v1.2.3
  #   GitHub Release
  #   Release Notes
  #
  # NO crea imagen Docker.
  # ==========================================================
  create-release:

    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calcular versión semántica
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"

          major_pattern: "major:"
          minor_pattern: "feat:"

          version_format: "${major}.${minor}.${patch}"

      - name: Obtener fecha
        id: date
        run: |
          export TZ="America/Argentina/Tucuman"
          echo "date=$(date +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Mostrar versión
        run: |
          echo "=========================================="
          echo " Creando nueva versión"
          echo "=========================================="
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag:     ${{ steps.version.outputs.version_tag }}"
          echo "Tipo:    ${{ steps.version.outputs.version_type }}"
          echo "Fecha:   ${{ steps.date.outputs.date }}"
          echo "=========================================="

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          RELEASE_DATE: ${{ steps.date.outputs.date }}

        run: |
          echo "Verificando Release $VERSION_TAG..."

          if gh release view "$VERSION_TAG" > /dev/null 2>&1; then

            echo "=========================================="
            echo "El Release $VERSION_TAG ya existe."
            echo "No se creará nuevamente."
            echo "=========================================="

          else

            echo "Creando Release $VERSION_TAG..."

            gh release create "$VERSION_TAG" \
              --target main \
              --title "$VERSION_TAG - $RELEASE_DATE" \
              --generate-notes \
              --latest

            echo "=========================================="
            echo "Release creado correctamente:"
            echo "$VERSION_TAG - $RELEASE_DATE"
            echo "=========================================="

          fi
